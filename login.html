<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — CoinTap</title>
    <meta name="theme-color" content="#f19e36" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f19e36;
            --gold-light: #ffd27a;
            --gold-dark: #c97a1a;
            --bg: #0a0a0f;
            --surface: #13131f;
            --surface2: #1c1c2e;
            --border: rgba(241, 158, 54, 0.2);
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: floatUp var(--dur) ease-in infinite;
            animation-delay: var(--delay);
            left: var(--x);
        }

        @keyframes floatUp {
            0%   { transform: translateY(110vh) scale(0); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: drift 8s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(241,158,54,0.18), transparent 70%);
            top: -100px; right: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(241,158,54,0.1), transparent 70%);
            bottom: -80px; left: -80px;
            animation-delay: -4s;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.1); }
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 20px 24px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover {
            background: rgba(241,158,54,0.15);
            border-color: var(--gold);
            transform: translateX(-3px);
        }

        /* Coin display */
        .coin-banner {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 28px;
            animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .coin-ring {
            position: relative;
            width: 90px; height: 90px;
            display: flex; align-items: center; justify-content: center;
        }

        .coin-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--gold), var(--gold-light), var(--gold-dark), var(--gold));
            animation: spinRing 3s linear infinite;
        }

        .coin-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: var(--bg);
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .coin-img {
            position: relative;
            z-index: 1;
            width: 70px; height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(241,158,54,0.8));
            animation: pulse 2s ease-in-out infinite;
        }

        /* Fallback coin if no image */
        .coin-fallback {
            position: relative;
            z-index: 1;
            width: 70px; height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold), var(--gold-dark));
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 30px rgba(241,158,54,0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(241,158,54,0.6)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(241,158,54,1)); }
        }

        .coin-count {
            margin-top: 14px;
            font-family: 'Space Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .coin-label {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Form card */
        .form-card {
            position: relative;
            z-index: 10;
            margin: 0 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 32px 24px;
            backdrop-filter: blur(20px);
            animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
            box-shadow: 0 0 60px rgba(241,158,54,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .form-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-subtitle span {
            color: var(--gold);
        }

        /* Input groups */
        .field {
            margin-bottom: 16px;
            animation: fadeInField 0.5s ease both;
        }
        .field:nth-child(1) { animation-delay: 0.2s; }
        .field:nth-child(2) { animation-delay: 0.3s; }
        .field:nth-child(3) { animation-delay: 0.4s; }
        .field:nth-child(4) { animation-delay: 0.5s; }

        @keyframes fadeInField {
            from { transform: translateX(-10px); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .field input {
            width: 100%;
            background: var(--surface2);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 14px 14px 44px;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .field input::placeholder { color: var(--text-muted); }

        .field input:focus {
            border-color: var(--gold);
            background: rgba(241,158,54,0.05);
            box-shadow: 0 0 0 4px rgba(241,158,54,0.1);
        }

        .field input:focus + svg,
        .input-wrap:focus-within svg {
            opacity: 1;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            color: #1a0e00;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInField 0.5s ease 0.6s both;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(241,158,54,0.5);
        }
        .submit-btn:hover::before { opacity: 1; }

        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(241,158,54,0.3);
        }

        /* Ripple on click */
        .submit-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .login-link {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            animation: fadeInField 0.5s ease 0.7s both;
        }
        .login-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Animated particles -->
    <div class="bg-particles" id="particles"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Header -->
    <div class="header">
        <a href="/index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M22 12H2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <path d="M8 19L2 12L8 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </div>

    <!-- Coin display -->
    <div class="coin-banner">
        <div class="coin-ring">
            <img src="./assets/images/coin.png" class="coin-img" alt="coin"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
            <div class="coin-fallback" style="display:none">🪙</div>
        </div>
        <div class="coin-count" id="coinCount">0</div>
        <div class="coin-label">Your Coins</div>
    </div>

    <!-- Form card -->
    <div class="form-card">
        <div class="form-title">Create Account</div>
        <div class="form-subtitle">Sign up to save your rank and <span>coins</span> forever.</div>

        <div class="field">
            <label for="name">Full Name</label>
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="#f19e36" stroke-width="1.8"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#f19e36" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="text" id="name" name="name" placeholder="Ismingizni kiriting">
            </div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="3" stroke="#f19e36" stroke-width="1.8"/>
                    <path d="M2 8l10 6 10-6" stroke="#f19e36" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="email@example.com">
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="11" width="14" height="10" rx="2" stroke="#f19e36" stroke-width="1.8"/>
                    <path d="M8 11V7a4 4 0 018 0v4" stroke="#f19e36" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="••••••••">
            </div>
        </div>

        <div class="field">
            <label for="confirm">Confirm Password</label>
            <div class="input-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M9 12l2 2 4-4" stroke="#f19e36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="3" y="3" width="18" height="18" rx="4" stroke="#f19e36" stroke-width="1.8"/>
                </svg>
                <input type="password" id="confirm" name="confirm" placeholder="••••••••">
            </div>
        </div>

        <button class="submit-btn" onclick="handleSubmit(event)">Create Account 🚀</button>

        <div class="divider">yoki</div>
        <div class="login-link">Allaqachon akkauntingiz bormi? <a href="#">Kirish</a></div>
    </div>

    <br><br>

    <script src="./assets/js/charge.js"></script>
    <script>
        // Coins
        const coins = localStorage.getItem('coins') || 0;
        const el = document.getElementById('coinCount');
        // Animated count up
        let current = 0;
        const target = parseInt(coins);
        const step = Math.max(1, Math.floor(target / 40));
        const timer = setInterval(() => {
            current = Math.min(current + step, target);
            el.textContent = current.toLocaleString();
            if (current >= target) clearInterval(timer);
        }, 30);

        // Particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.cssText = `
                --x: ${Math.random() * 100}%;
                --dur: ${4 + Math.random() * 6}s;
                --delay: ${Math.random() * 8}s;
                width: ${2 + Math.random() * 4}px;
                height: ${2 + Math.random() * 4}px;
                opacity: ${0.3 + Math.random() * 0.5};
            `;
            container.appendChild(p);
        }

        // Ripple on submit
        function handleSubmit(e) {
            const btn = e.currentTarget;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const size = Math.max(btn.offsetWidth, btn.offsetHeight);
            ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.offsetX - size/2}px;top:${e.offsetY - size/2}px`;
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }
    </script>
</body>
</html>
